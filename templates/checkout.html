{% extends "base.html" %}

{% block content %}

<div class="center-card">

    <h1>
        🚪 Student Check Out
    </h1>


    {% if not records %}

        <div class="empty">

            No students available for Check Out.

            <br><br>

            Students must Check In first.

        </div>

    {% else %}

    <form
        method="POST"
        class="attendance-form"
    >

        <label>
            Select Student
        </label>

        <select
            name="student_id"
            required
        >

            {% for attendance, student in records %}

            <option value="{{ student.id }}">

                {{ student.student_id }}
                -
                {{ student.name }}

                —
                Check In:
                {{ attendance.check_in_time.strftime(
                    "%I:%M %p"
                ) }}

            </option>

            {% endfor %}

        </select>


        <div
            id="clock"
            class="clock"
        ></div>


        <button
            type="submit"
            class="danger-button large"
        >
            🚪 CHECK OUT
        </button>

    </form>

    {% endif %}

</div>


<script>

function updateClock() {

    const now = new Date();

    document.getElementById(
        "clock"
    ).innerText = now.toLocaleString();

}

updateClock();

setInterval(
    updateClock,
    1000
);

</script>

{% endblock %}
