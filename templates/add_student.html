{% extends "base.html" %}

{% block title %}
Add Student - Student Attendance
{% endblock %}

{% block page_title %}
Add Student
{% endblock %}

{% block content %}

<div class="page-header">

    <div>

        <h2>
            Add New Student
        </h2>

        <p>
            Enter the student's information below.
        </p>

    </div>

    <a
        href="{{ url_for('students') }}"
        class="btn btn-light"
    >
        ← Back
    </a>

</div>


<div class="card form-card">

    <form
        method="POST"
        class="student-form"
    >

        <div class="form-grid">

            <div class="form-group">

                <label>
                    Student ID
                    <span>*</span>
                </label>

                <input
                    type="text"
                    name="student_id"
                    placeholder="e.g. ST001"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Full Name
                    <span>*</span>
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter full name"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Gender
                </label>

                <select name="gender">

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Phone
                </label>

                <input
                    type="text"
                    name="phone"
                    placeholder="Phone number"
                >

            </div>


            <div class="form-group full">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="student@example.com"
                >

            </div>

        </div>


        <div class="form-actions">

            <a
                href="{{ url_for('students') }}"
                class="btn btn-light"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Save Student
            </button>

        </div>

    </form>

</div>

{% endblock %}
